name: archive

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      limit:
        default: "400"
      workers:
        default: "2"
      match:
        default: ""

concurrency:
  group: archive
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  save:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - run: printf '%s' "$KEYS" > .archive-keys
        env:
          KEYS: ${{ secrets.ARCHIVE_KEYS }}
      - run: timeout 3600 python3 archive.py check || true
      # stop before the job limit so progress still gets committed
      - run: timeout 16000 python3 archive.py save ${{ inputs.limit || '400' }} ${{ inputs.workers || '2' }} "$MATCH" || true
        env:
          MATCH: ${{ inputs.match }}
      - run: |
          cp data/archive_state.json /tmp/state.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch -q origin main && git reset -q --hard origin/main
            python3 archive.py merge /tmp/state.json && python3 build.py
            git add data/archive_state.json entries.json pages.json site app type item
            git diff --cached --quiet && exit 0
            git commit -q -m "Archive progress" && git push -q origin HEAD:main && exit 0
            sleep $((attempt * 10))
          done
          exit 1
      # keep going until nothing is left to save; cron alone proved unreliable
      - if: success()
        run: |
          left=$(python3 -c "import json,glob;s=json.load(open('data/archive_state.json'));print(sum(1 for v in s.values() if not v.get('ts') and v.get('fails',0)<3))")
          echo "$left urls still missing"
          if [ "$left" -gt 0 ]; then gh workflow run archive.yml -f limit="${{ inputs.limit || '400' }}" -f workers="${{ inputs.workers || '2' }}"; fi
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
