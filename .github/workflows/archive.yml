name: archive

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      limit:
        default: "2000"
      workers:
        default: "1"
      match:
        default: ""

concurrency:
  group: archive
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  save:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - run: printf '%s' "$KEYS" > .archive-keys
        env:
          KEYS: ${{ secrets.ARCHIVE_KEYS }}
      - run: timeout 3600 python3 archive.py check || true
      # keep the lookup results even if the save step is cancelled
      - run: devtools/commit-archive.sh
      # stop before the job limit so progress still gets committed
      - run: timeout 16000 python3 archive.py save ${{ inputs.limit || '2000' }} ${{ inputs.workers || '1' }} "$MATCH" || true
        env:
          MATCH: ${{ inputs.match }}
      - run: devtools/commit-archive.sh
      # keep going until nothing is left to save; cron alone proved unreliable
      - if: success()
        run: |
          left=$(python3 -c "import json,glob;s=json.load(open('data/archive_state.json'));import time;print(sum(1 for v in s.values() if not v.get('ts') and v.get('fails',0)<3 and time.time()-v.get('sent',0)>86400))")
          echo "$left urls still missing"
          if [ "$left" -gt 0 ]; then gh workflow run archive.yml -f limit="${{ inputs.limit || '2000' }}" -f workers="${{ inputs.workers || '1' }}"; fi
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
