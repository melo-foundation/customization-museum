name: archive

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      limit:
        default: "400"
      workers:
        default: "2"
      match:
        default: ""

concurrency:
  group: archive
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  save:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - run: printf '%s' "$KEYS" > .archive-keys
        env:
          KEYS: ${{ secrets.ARCHIVE_KEYS }}
      - run: timeout 3600 python3 archive.py check || true
      # stop before the job limit so progress still gets committed
      - run: timeout 16000 python3 archive.py save ${{ inputs.limit || '400' }} ${{ inputs.workers || '2' }} "$MATCH" || true
        env:
          MATCH: ${{ inputs.match }}
      - run: python3 build.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/archive_state.json entries.json
          if ! git diff --cached --quiet; then
            git commit -m "Archive progress"
            git pull --rebase
            git push
          fi
