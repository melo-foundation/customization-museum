name: shot

on:
  workflow_dispatch:
    inputs:
      urls:
        description: Page URLs to screenshot, separated by spaces or newlines (max 40)
        required: true
      width:
        description: Viewport width
        default: "1024"
      tag:
        default: shots

permissions:
  contents: read

jobs:
  shot:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      # 2000s pages were designed for Windows core fonts (Verdana, Tahoma, Arial, Georgia...)
      - run: |
          echo ttf-mscorefonts-installer msttcorefonts/accepted-mscorefonts-eula select true | sudo debconf-set-selections
          sudo apt-get install -y -q ttf-mscorefonts-installer >/dev/null
          # Tahoma isn't redistributable and Wine's copy renders blank in Chromium; Arial is the closest width.
          mkdir -p ~/.config/fontconfig
          printf '<?xml version="1.0"?><!DOCTYPE fontconfig SYSTEM "fonts.dtd"><fontconfig><alias binding="same"><family>Tahoma</family><prefer><family>Arial</family></prefer></alias></fontconfig>' > ~/.config/fontconfig/fonts.conf
          fc-cache -f >/dev/null
          fc-match Verdana; fc-match Tahoma
          fc-match Verdana | grep -qi verdana
          fc-match Tahoma | grep -qiE "tahoma|arial" || echo "::warning::Tahoma alias not applied"
      - run: |
          mkdir out
          printf '%s\n' $URLS | grep -E '^https?://[^[:space:]]+$' | head -40 > out/urls.txt
          n=0
          while read -r u; do
            n=$((n + 1)); f=$(printf '%02d' $n)
            timeout 120 google-chrome --headless=new --no-sandbox --disable-gpu --hide-scrollbars \
              --window-size="$WIDTH,3000" --virtual-time-budget=25000 --screenshot="out/$f.png" "$u" >/dev/null 2>&1 || true
            timeout 120 google-chrome --headless=new --no-sandbox --disable-gpu --virtual-time-budget=25000 --dump-dom "$u" > "out/$f.html" 2>/dev/null || true
            printf '%s\t%s\n' "$f" "$u" >> out/index.tsv
            sleep 2
          done < out/urls.txt
        env:
          URLS: ${{ inputs.urls }}
          WIDTH: ${{ inputs.width }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.tag }}
          path: out
          retention-days: 7
