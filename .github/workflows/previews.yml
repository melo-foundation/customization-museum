name: previews

on:
  workflow_dispatch:
    inputs:
      sources:
        description: Source modules, space separated
        required: true

concurrency:
  group: previews

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      SOURCES: ${{ inputs.sources }}
    steps:
      - uses: actions/checkout@v4
      - run: echo "$SOURCES" | grep -qE '^[a-z0-9_ ]+$'
      - run: pip install -q pillow
      - run: timeout 19000 python3 previews.py $SOURCES || true
      - run: |
          mkdir -p /tmp/prev && cp -n previews/*.png /tmp/prev/ 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch -q origin main && git reset -q --hard origin/main
            mkdir -p previews && cp -n /tmp/prev/*.png previews/ 2>/dev/null || true
            python3 build.py
            git add previews entries.json pages.json site app type item
            git diff --cached --quiet && exit 0
            git commit -q -m "Previews: $SOURCES" && git push -q origin HEAD:main && exit 0
            sleep $((attempt * 10))
          done
          exit 1
